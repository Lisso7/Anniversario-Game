<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Match ❤</title>
<style>
  :root{
    --pink-deep:#ff6fa5;
    --pink-mid:#ffa8cb;
    --pink-light:#ffe1ee;
    --plum:#5c2a4d;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--plum);
    font-family:-apple-system, "Helvetica Neue", Arial, sans-serif;
    touch-action:manipulation;
  }
  #wrap{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 20%, #7a3a63, #3a1530 75%);
  }
  #stage{
    position:relative;
    width:100%; height:100%;
    max-width:520px;
    max-height:920px;
    background:#000;
    overflow:hidden;
  }
  canvas{
    display:block;
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:#000;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
  }
  #hud{
    position:absolute; top:0; left:0; right:0;
    padding:14px 16px 0;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
    font-weight:700; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.25);
    z-index:5;
  }
  #hearts{ display:flex; gap:4px; font-size:20px; }
  #skipBtn{
    pointer-events:auto;
    background:rgba(0,0,0,.35);
    color:#fff; border:none; border-radius:20px;
    padding:6px 14px; font-size:13px; font-weight:600;
    letter-spacing:.02em;
    display:none;
  }
  #overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:32px;
    background:linear-gradient(180deg, rgba(58,21,48,.55), rgba(58,21,48,.85));
    color:#fff;
    opacity:0; pointer-events:none;
    transition:opacity .4s ease;
    z-index:10;
  }
  #overlay.show{ opacity:1; pointer-events:auto; }
  #overlay h1{ font-size:22px; margin:0 0 10px; font-weight:800; letter-spacing:.01em; }
  #overlay p{ font-size:15px; line-height:1.5; margin:0 0 22px; color:var(--pink-light); max-width:340px; }
  .btn{
    background:var(--pink-deep);
    color:#fff; border:none; border-radius:30px;
    padding:14px 34px; font-size:16px; font-weight:800;
    box-shadow:0 6px 0 #c94d80;
    letter-spacing:.02em;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #c94d80; }
  .btn.secondary{
    background:transparent; color:var(--pink-light);
    box-shadow:none; border:2px solid var(--pink-mid);
    padding:10px 24px; font-size:13px; margin-top:12px;
  }
  #tapHint{
    position:absolute; bottom:26px; left:0; right:0;
    text-align:center; color:#fff; opacity:.85;
    font-size:13px; font-weight:600; text-shadow:0 2px 0 rgba(0,0,0,.3);
    z-index:4; pointer-events:none;
    animation:pulse 1.6s ease-in-out infinite;
    display:none;
  }
  @keyframes pulse{ 0%,100%{opacity:.4} 50%{opacity:.95} }

  #quizPanel{
    position:absolute; left:0; right:0; bottom:0;
    padding:16px 16px 22px;
    background:linear-gradient(180deg, rgba(58,21,48,0) 0%, rgba(58,21,48,.92) 22%, rgba(58,21,48,.97) 100%);
    z-index:8;
    opacity:0; transform:translateY(12px);
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  #quizPanel.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #quizQuestion{
    color:#fff; font-weight:800; font-size:16px;
    text-align:center; margin:0 0 12px;
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  #quizOptions{ display:flex; flex-direction:column; gap:8px; }
  .optBtn{
    background:#fff5f9; color:#3a1530; border:none; border-radius:14px;
    padding:12px 14px; font-size:14px; font-weight:700;
    text-align:center;
  }
  .optBtn:active{ transform:scale(.98); }
  .optBtn.correct{ background:#3fbf6a; color:#fff; }
  .optBtn.wrong{ background:#e0417f; color:#fff; }
  .optBtn.disabled{ opacity:.6; pointer-events:none; }
  #quizFeedback{
    text-align:center; color:#ffe1ee; font-weight:700; font-size:13px;
    min-height:16px; margin-top:8px;
  }

  #finaleScreen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:22px 16px;
    background:linear-gradient(160deg, #ffb3d1, #ff6fa5 55%, #c9436b);
    z-index:12;
  }
  #finaleScreen.show{ display:flex; }
  #finaleCard{
    width:100%;
    max-width:400px;
    max-height:78%;
    background:#fffaf3;
    border-radius:16px;
    border:3px solid #ff9dc4;
    outline:1px solid #ffe1ee;
    outline-offset:-8px;
    box-shadow:0 10px 30px rgba(58,21,48,.35);
    padding:26px 22px 18px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }
  #finaleCard::before, #finaleCard::after{
    content:'❤';
    position:absolute;
    top:8px;
    color:#ff9dc4;
    font-size:14px;
  }
  #finaleCard::before{ left:12px; transform:rotate(-15deg); }
  #finaleCard::after{ right:12px; transform:rotate(15deg); }
  #finaleTitle{
    font-family:Georgia, 'Times New Roman', serif;
    font-size:19px;
    font-weight:700;
    color:#8a1a4e;
    text-align:center;
    line-height:1.4;
    letter-spacing:.02em;
    flex-shrink:0;
  }
  #finaleDivider{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:12px auto 14px;
    flex-shrink:0;
  }
  #finaleDivider span{
    color:#ff6fa5; font-size:11px;
  }
  #finaleDivider .line{
    width:34px; height:1px; background:#ffc2dc; color:transparent; font-size:0;
  }
  #finaleBody{
    font-family:Georgia, 'Times New Roman', serif;
    font-size:15px;
    line-height:1.6;
    color:#3a1530;
    text-align:left;
    white-space:pre-line;
    flex:1;
    min-height:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    word-break:break-word;
    overflow-wrap:anywhere;
    padding-right:4px;
  }
  #finaleReplayBtn{
    color:#fff5f9; border-color:rgba(255,255,255,.7);
  }

  #l3Hint{
    position:absolute; top:50px; left:16px; right:16px;
    text-align:center; z-index:6;
    display:none; pointer-events:none;
  }
  #l3Hint span{
    display:inline-block;
    background:rgba(58,21,48,.72);
    color:#fff; font-weight:700; font-size:12px;
    padding:6px 14px; border-radius:14px;
    text-shadow:0 1px 0 rgba(0,0,0,.3);
  }
  #dpad{
    position:absolute; left:0; right:0; bottom:20px;
    display:none;
    justify-content:center;
    z-index:7;
  }
  #dpad .pad{
    display:grid;
    grid-template-columns:52px 52px 52px;
    grid-template-rows:52px 52px 52px;
    gap:4px;
  }
  .dpadBtn{
    background:rgba(255,255,255,.22);
    border:2px solid rgba(255,255,255,.55);
    border-radius:14px;
    color:#fff; font-size:20px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  .dpadBtn:active{ background:rgba(255,255,255,.5); }
  #dpadUp{ grid-column:2; grid-row:1; }
  #dpadLeft{ grid-column:1; grid-row:2; }
  #dpadRight{ grid-column:3; grid-row:2; }
  #dpadDown{ grid-column:2; grid-row:3; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="200" height="356"></canvas>

    <div id="hud">
      <div id="hearts"></div>
      <button id="skipBtn">Salta ▸</button>
    </div>

    <div id="tapHint">Tocca per saltare</div>

    <div id="l3Hint"><span id="l3HintText">Usa le frecce per muoverti</span></div>
    <div id="dpad">
      <div class="pad">
        <div id="dpadUp" class="dpadBtn">▲</div>
        <div id="dpadLeft" class="dpadBtn">◀</div>
        <div id="dpadRight" class="dpadBtn">▶</div>
        <div id="dpadDown" class="dpadBtn">▼</div>
      </div>
    </div>

    <div id="quizPanel">
      <div id="quizQuestion">Domanda</div>
      <div id="quizOptions"></div>
      <div id="quizFeedback"></div>
    </div>

    <div id="overlay">
      <h1 id="ovTitle">Titolo</h1>
      <p id="ovText">Testo</p>
      <button class="btn" id="ovBtn">Continua</button>
      <button class="btn secondary" id="ovBtn2" style="display:none;">Riprova</button>
    </div>

    <div id="finaleScreen">
      <div id="finaleCard">
        <div id="finaleTitle"></div>
        <div id="finaleDivider"><span class="line">—</span><span>❤</span><span class="line">—</span></div>
        <div id="finaleBody"></div>
      </div>
      <button class="btn secondary" id="finaleReplayBtn">Rigioca dall'inizio</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ============================================================
  // SETUP
  // ============================================================
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = canvas.width, H = canvas.height;

  function fitCanvas(){
    const stage = document.getElementById('stage');
    const sw = stage.clientWidth, sh = stage.clientHeight;
    const scale = Math.min(sw/W, sh/H);
    canvas.style.width  = Math.floor(W*scale) + 'px';
    canvas.style.height = Math.floor(H*scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', fitCanvas);
  fitCanvas();

  const overlay   = document.getElementById('overlay');
  const ovTitle   = document.getElementById('ovTitle');
  const ovText    = document.getElementById('ovText');
  const ovBtn     = document.getElementById('ovBtn');
  const ovBtn2    = document.getElementById('ovBtn2');
  const heartsEl  = document.getElementById('hearts');
  const tapHint   = document.getElementById('tapHint');
  const skipBtn   = document.getElementById('skipBtn');
  const quizPanel = document.getElementById('quizPanel');
  const quizQ     = document.getElementById('quizQuestion');
  const quizOpts  = document.getElementById('quizOptions');
  const quizFb    = document.getElementById('quizFeedback');
  const l3Hint    = document.getElementById('l3Hint');
  const l3HintText= document.getElementById('l3HintText');
  const dpad      = document.getElementById('dpad');
  const dpadUp    = document.getElementById('dpadUp');
  const dpadDown  = document.getElementById('dpadDown');
  const dpadLeft  = document.getElementById('dpadLeft');
  const dpadRight = document.getElementById('dpadRight');
  const finaleScreen = document.getElementById('finaleScreen');
  const finaleTitleEl = document.getElementById('finaleTitle');
  const finaleBodyEl  = document.getElementById('finaleBody');
  const finaleReplayBtn = document.getElementById('finaleReplayBtn');

  const PAL = {
    skin:'#f6c9a0', hairD:'#6b3b23', outline:'#3a1530',
    dress:'#ff5c9a', dressSh:'#e0417f',
    shirtBoy:'#7ec8e3', shirtBoySh:'#5aa6c2', jeansBoy:'#3a4a7a',
    shoe:'#3a1530', white:'#fff5f9', heart:'#ff3d78',
    skyTop:'#ffd3e6', skyBot:'#ffb3d1',
    groundTop:'#ff9dc4', groundBot:'#e8558f',
    farBuildA:'#ffc2dc', farBuildB:'#ffaacf',
    rock:'#9b7a86', rockSh:'#7a5e69',
    box:'#c98a55', boxSh:'#a86c3d',
    puddle:'#8fd7ff', puddleSh:'#5fb8ea',
    pharm:'#fff5f9', pharmRoof:'#ff5c9a', cross:'#3fbf6a',
    barWall:'#7a3350', barWallDark:'#5c2540', barFloor:'#a85c86', barFloorDark:'#8a4570',
    tableWood:'#8a5a3c', tableTop:'#c98a55',
    apron:'#fff5f9', waiterHair:'#4f2a18', waiterShirt:'#5c2a4d',
    glassLI:'#e8a23c', glassCap:'#ff8fc4', glassFoam:'#fff5f9',
    nightTop:'#241033', nightBot:'#4a2350',
    carBody:'#241522', carWindow:'#7fc7e8', carWheel:'#120a12',
    bottleA:'#ff9dc4', bottleB:'#ffd3e6', bottleC:'#c9436b'
  };

  function px(x,y,w,h,color){
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }

  function drawHeart(x,y,s,color){
    color = color || PAL.heart;
    px(x-2*s,y-2*s,2*s,2*s,color);
    px(x+0*s,y-2*s,2*s,2*s,color);
    px(x-2*s,y-0*s,6*s,2*s,color);
    px(x-1*s,y+2*s,4*s,2*s,color);
    px(x-0*s,y+4*s,2*s,2*s,color);
  }

  // ============================================================
  // STATE MACHINE (whole game)
  // ============================================================
  const STATE = {
    BOOT:'boot',
    L1_INTRO:'l1_intro', L1_MESSAGE:'l1_message', L1_LEVEL:'l1_level',
    L1_PHARMACY:'l1_pharmacy', L1_TEST:'l1_test', L1_COMPLETE:'l1_complete', L1_GAMEOVER:'l1_gameover',
    L2_INTRO:'l2_intro', L2_QUIZ:'l2_quiz', L2_OUTRO:'l2_outro', L2_COMPLETE:'l2_complete',
    L3_MAP:'l3_map', L3_COMPLETE:'l3_complete', FINALE_ANIM:'finale_anim', FINALE:'finale'
  };
  let state = STATE.BOOT;
  let lastT = 0, clock = 0;
  let gameStarted = false;

  function showOverlay(title, text, btnLabel, cb, btn2Label, cb2){
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btnLabel;
    ovBtn.onclick = () => { hideOverlay(); cb && cb(); };
    if(btn2Label){
      ovBtn2.style.display = 'inline-block';
      ovBtn2.textContent = btn2Label;
      ovBtn2.onclick = () => { hideOverlay(); cb2 && cb2(); };
    } else {
      ovBtn2.style.display = 'none';
    }
    overlay.classList.add('show');
  }
  function hideOverlay(){ overlay.classList.remove('show'); }

  function renderHearts(n, max){
    let s = '';
    for(let i=0;i<max;i++) s += (i<n ? '❤️' : '🤍');
    heartsEl.textContent = s;
  }

  // ============================================================
  // FACE / SPRITE HELPERS
  // ============================================================
  // big stylised face used for the tinder cards + match screen
  function drawFaceCard(cx, cy, hairColor, skin, small){
    skin = skin || PAL.skin;
    const s = small ? 0.7 : 1;
    px(cx-12*s, cy-14*s, 24*s, 24*s, skin);
    px(cx-14*s, cy-20*s, 28*s, 12*s, hairColor);
    px(cx-14*s, cy-14*s, 6*s, 16*s, hairColor);
    px(cx+8*s, cy-14*s, 6*s, 16*s, hairColor);
    px(cx-7*s, cy-2*s, 4*s, 4*s, PAL.outline);
    px(cx+3*s, cy-2*s, 4*s, 4*s, PAL.outline);
    px(cx-4*s, cy+7*s, 8*s, 3*s, '#c9436b');
  }

  // small face used for seated busts / walking characters
  function drawFaceMini(cx, cy, hairColor, skin, s){
    skin = skin || PAL.skin;
    s = s || 1;
    px(cx-6*s, cy-7*s, 12*s, 12*s, skin);
    px(cx-7*s, cy-10*s, 14*s, 6*s, hairColor);
    px(cx-7*s, cy-7*s, 3*s, 8*s, hairColor);
    px(cx+4*s, cy-7*s, 3*s, 8*s, hairColor);
    px(cx-3.5*s, cy-1*s, 2*s, 2*s, PAL.outline);
    px(cx+1.5*s, cy-1*s, 2*s, 2*s, PAL.outline);
    px(cx-2*s, cy+3*s, 4*s, 1.5*s, '#c9436b');
  }

  // generic full-body walker for the bar intro/outro scenes
  function drawWalker(x, y, kind, legFrame, lean){
    lean = lean || 0;
    const top   = kind==='girl' ? PAL.dress : PAL.shirtBoy;
    const topSh = kind==='girl' ? PAL.dressSh : PAL.shirtBoySh;
    const legOff = legFrame===0 ? 2 : -2;
    px(x+3+lean, y+20, 4, 8-Math.max(0,legOff), PAL.skin);
    px(x+9+lean, y+20, 4, 8+Math.max(0,legOff), PAL.skin);
    px(x+3+lean, y+26, 4, 2, PAL.shoe);
    px(x+9+lean, y+26, 4, 2, PAL.shoe);
    px(x+lean, y+10, 16, 12, top);
    px(x+lean, y+18, 16, 4, topSh);
    px(x-2+lean, y+11, 3, 8, PAL.skin);
    px(x+15+lean, y+11, 3, 8, PAL.skin);
    drawFaceMini(x+8+lean, y+4, PAL.hairD, PAL.skin, 1);
  }

  // ============================================================
  // LIVELLO 1a — INTRO: swipe stile Tinder (controllato dal giocatore)
  // ============================================================
  const introCards = [
    { name:'Marco, 27',    match:false, hair:'#e6c873' },
    { name:'Luca, 29',     match:false, hair:'#2b2320' },
    { name:'Gabriele, 25', match:true,  hair:PAL.hairD }
  ];
  let introT1 = 0, introCardIdx = 0, introCardX = 0, introCardRot = 0;
  let cardState = 'wait'; // wait (in attesa del drag) -> anim (volo via) -> match
  const SWIPE_TIME = 0.28, DRAG_THRESHOLD = 34;
  let matchT = 0;
  let animFromX = 0, animDir = 1, animT = 0;
  let wrongDirHintT = 0;
  let dragActive = false, dragStartX = 0, dragOffsetX = 0;

  function resetIntro1(){
    introT1=0; introCardIdx=0; introCardX=0; introCardRot=0;
    cardState='wait'; matchT=0; animT=0; wrongDirHintT=0; dragActive=false; dragOffsetX=0;
  }

  function updateIntro1(dt){
    introT1 += dt;
    if(wrongDirHintT>0) wrongDirHintT -= dt;

    if(cardState==='anim'){
      animT += dt;
      const p = Math.min(1, animT/SWIPE_TIME);
      introCardX = animFromX + (animDir*230 - animFromX)*p;
      introCardRot = animDir*20;
      if(p>=1){
        if(introCards[introCardIdx].match){
          cardState='match'; matchT=0;
        } else {
          introCardIdx++; cardState='wait'; introCardX=0; introCardRot=0;
        }
      }
    } else if(cardState==='match'){
      matchT += dt;
      if(matchT > 2.6) goToMessage();
    }
  }

  function canvasXFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? (e.touches[0]||e.changedTouches[0]).clientX : e.clientX;
    return (clientX - rect.left) * (W/rect.width);
  }

  function introDragStart(e){
    if(!(state===STATE.L1_INTRO && gameStarted && cardState==='wait')) return false;
    dragActive = true;
    dragStartX = canvasXFromEvent(e);
    dragOffsetX = 0;
    return true;
  }
  function introDragMove(e){
    if(!dragActive) return;
    const x = canvasXFromEvent(e);
    dragOffsetX = x - dragStartX;
    introCardX = dragOffsetX;
    introCardRot = dragOffsetX * 0.09;
  }
  function introDragEnd(){
    if(!dragActive) return;
    dragActive = false;
    const card = introCards[introCardIdx];
    if(Math.abs(dragOffsetX) > DRAG_THRESHOLD){
      const dir = dragOffsetX > 0 ? 1 : -1;
      if(card.match && dir < 0){
        introCardX = 0; introCardRot = 0;
        wrongDirHintT = 1.8;
      } else {
        cardState = 'anim'; animT = 0; animFromX = dragOffsetX; animDir = dir;
      }
    } else {
      introCardX = 0; introCardRot = 0;
    }
  }

  function drawPhoneFrame(){
    const pw=124, ph=232, px0=(W-pw)/2, py0=18;
    px(px0-6, py0-10, pw+12, ph+20, PAL.outline);
    px(px0, py0, pw, ph, '#1c1024');
    px(px0+4, py0+14, pw-8, ph-28, '#2a1424');
    return {px0,py0,pw,ph};
  }

  function drawIntroTinder(){
    px(0,0,W,H, '#3a1530');
    for(let i=0;i<14;i++){
      const hx = (i*37 + 20) % W;
      const hy = (i*53 + 10) % H;
      ctx.globalAlpha = 0.25;
      drawHeart(hx, hy, 3, '#ff9dc4');
      ctx.globalAlpha = 1;
    }
    if(cardState === 'match'){ drawMatchScreen(); return; }

    const {px0,py0,pw,ph} = drawPhoneFrame();
    const cx0 = px0 + pw/2, cy0 = py0 + ph/2;
    const card = introCards[introCardIdx] || introCards[introCards.length-1];

    ctx.save();
    ctx.translate(cx0 + introCardX, cy0);
    ctx.rotate(introCardRot * Math.PI/180);
    const cw = pw-20, ch = ph-40;
    px(-cw/2, -ch/2, cw, ch, PAL.white);
    px(-cw/2, -ch/2, cw, ch*0.62, '#ffd0e2');
    drawFaceCard(0, -ch*0.19, card.hair, PAL.skin, false);
    ctx.restore();

    // LIKE / NOPE stamp while dragging
    if(dragActive && Math.abs(dragOffsetX) > 12){
      ctx.save();
      ctx.globalAlpha = Math.min(1, Math.abs(dragOffsetX)/60);
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'center';
      if(dragOffsetX > 0){ ctx.fillStyle = '#3fbf6a'; ctx.fillText('LIKE ❤', cx0+30, cy0-ch*0.2); }
      else { ctx.fillStyle = '#e0417f'; ctx.fillText('NOPE', cx0-30, cy0-ch*0.2); }
      ctx.restore();
      ctx.textAlign = 'left';
    }

    ctx.fillStyle = PAL.white;
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(card.name, cx0, py0+ph-14);

    if(cardState==='wait' && !dragActive){

  // ============================================================
  // LIVELLO 1c — corsa con ostacoli
  // ============================================================
  const GROUND_Y = H - 46;
  const GRAVITY = 620;
  const JUMP_V = -230;
  let girl, obstacles, distance, targetDistance, scrollSpeed, spawnTimer, hearts, maxHearts, invuln, bgHeartT;
  let pharmacyX;

  function resetLevel(){
    girl = { x:40, y:GROUND_Y-28, vy:0, w:16, h:28, onGround:true, legFrame:0, legT:0, stumble:0 };
    obstacles = [];
    distance = 0;
    targetDistance = 1600;
    scrollSpeed = 78;
    spawnTimer = 1.0;
    hearts = 3; maxHearts = 3;
    invuln = 0;
    bgHeartT = 0;
    pharmacyX = null;
    renderHearts(hearts, maxHearts);
    tapHint.textContent = 'Tocca per saltare';
    tapHint.style.display = 'block';
    skipBtn.style.display = 'none';
  }

  function jump(){
    if(state === STATE.L1_LEVEL && girl.onGround){
      girl.vy = JUMP_V; girl.onGround = false;
    }
  }

  function spawnObstacle(){
    const types = ['rock','box','puddle'];
    const t = types[Math.floor(Math.random()*types.length)];
    let w=14,h=14;
    if(t==='rock'){ w=14;h=12; }
    if(t==='box'){ w=14;h=16; }
    if(t==='puddle'){ w=20;h=6; }
    obstacles.push({ x: W+10, y: GROUND_Y - h, w, h, type:t });
  }

  function resetAndStartLevel(){
    resetLevel();
    state = STATE.L1_LEVEL;
  }

  function updateLevel(dt){
    distance += scrollSpeed*dt;
    bgHeartT += dt;

    if(distance >= targetDistance && pharmacyX === null) pharmacyX = W + 30;

    girl.vy += GRAVITY*dt;
    girl.y += girl.vy*dt;
    if(girl.y >= GROUND_Y-28){ girl.y = GROUND_Y-28; girl.vy=0; girl.onGround=true; }

    if(girl.onGround){
      girl.legT += dt*8;
      girl.legFrame = Math.floor(girl.legT)%2;
    }

    if(invuln>0) invuln -= dt;

    if(pharmacyX === null){
      spawnTimer -= dt;
      if(spawnTimer <= 0){ spawnObstacle(); spawnTimer = 1.0 + Math.random()*0.7; }
    }

    for(const o of obstacles) o.x -= scrollSpeed*dt;
    obstacles = obstacles.filter(o => o.x + o.w > -10);

    if(invuln<=0){
      for(const o of obstacles){
        if(rectHit(girl.x, girl.y, girl.w, girl.h, o.x, o.y, o.w, o.h)){
          hearts -= 1; invuln = 1.1; girl.stumble = 0.35;
          renderHearts(hearts, maxHearts);
          if(hearts<=0){
            state = STATE.L1_GAMEOVER;
            showOverlay('Ops! Sei caduta', 'Riprova il percorso: fai attenzione agli ostacoli sul marciapiede.', 'Riprova', resetAndStartLevel);
          }
          break;
        }
      }
    }
    if(girl.stumble>0) girl.stumble -= dt;

    if(pharmacyX !== null){
      pharmacyX -= scrollSpeed*dt;
      if(pharmacyX < girl.x + girl.w - 6){
        state = STATE.L1_PHARMACY;
        pharmacyEnterT = 0;
        tapHint.style.display = 'none';
      }
    }
  }

  function rectHit(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx+bw-3 && ax+aw-3 > bx && ay < by+bh && ay+ah > by;
  }

  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, PAL.skyTop); g.addColorStop(1, PAL.skyBot);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    const off1 = (distance*0.15)%160;
    for(let i=-1;i<4;i++){
      const bx = i*80 - off1;
      px(bx, GROUND_Y-70, 46, 70, PAL.farBuildA);
      px(bx+50, GROUND_Y-52, 34, 52, PAL.farBuildB);
    }
    for(let i=0;i<6;i++){
      const hx = (i*70 + 30 - distance*0.4) % (W+40);
      const hy = 30 + (i*23)%80 + Math.sin(bgHeartT+i)*4;
      ctx.globalAlpha = 0.5;
      drawHeart(hx<0?hx+W+40:hx, hy, 2, '#ffffff');
      ctx.globalAlpha = 1;
    }
    px(0, GROUND_Y, W, H-GROUND_Y, PAL.groundBot);
    px(0, GROUND_Y, W, 4, PAL.groundTop);
    const off2 = (distance)%16;
    for(let x=-off2; x<W; x+=16) px(x, GROUND_Y+4, 8, 3, 'rgba(255,255,255,0.25)');
  }

  function drawObstacle(o){
    if(o.type==='rock'){
      px(o.x, o.y+4, o.w, o.h-4, PAL.rock);
      px(o.x+2, o.y, o.w-4, 6, PAL.rock);
      px(o.x+2, o.y+o.h-4, o.w-6, 3, PAL.rockSh);
    } else if(o.type==='box'){
      px(o.x, o.y, o.w, o.h, PAL.box);
      px(o.x, o.y+o.h-4, o.w, 4, PAL.boxSh);
      px(o.x, o.y+o.h/2-1, o.w, 2, PAL.boxSh);
    } else if(o.type==='puddle'){
      px(o.x, o.y+2, o.w, o.h-2, PAL.puddle);
      px(o.x+2, o.y+o.h-2, o.w-4, 2, PAL.puddleSh);
    }
  }

  function drawPlayerTag(){
    const bob = Math.sin(bgHeartT*4)*2;
    const ax = girl.x + girl.w/2, ay = girl.y - 20 + bob;
    ctx.textAlign = 'center';
    ctx.font = 'bold 7px monospace';
    ctx.fillStyle = PAL.outline;
    ctx.fillText('Francesca', ax+0.5, ay-6+0.5);

    ctx.fillText('Francesca', ax, ay-6);
    ctx.fillStyle = PAL.heart;
    ctx.beginPath();
    ctx.moveTo(ax-4, ay-2); ctx.lineTo(ax+4, ay-2); ctx.lineTo(ax, ay+4);
    ctx.closePath(); ctx.fill();
    ctx.textAlign = 'left';
  }

  function drawGirl(){

    px(gx-2+lean, gy+11, 3, 8, PAL.skin);
    px(gx+15+lean, gy+11, 3, 8, PAL.skin);
    px(gx+2+lean, gy-2, 12, 12, PAL.skin);
    px(gx+lean, gy-6, 16, 8, PAL.hairD);
    px(gx+lean, gy-2, 4, 14, PAL.hairD);
    px(gx+12+lean, gy-2, 4, 14, PAL.hairD);

  function drawLevel(){
    drawBackground();
    if(pharmacyX !== null) drawPharmacyBuilding(pharmacyX);
    for(const o of obstacles) drawObstacle(o);
    if(invuln>0 && Math.floor(invuln*20)%2===0){
      // flicker
    } else {
      drawGirl();
      drawPlayerTag();
    }
    const pw = W-30;
    px(15, 8, pw, 6, 'rgba(255,255,255,0.35)');

  // ============================================================

  let pharmacyEnterT = 0;

  function drawBar(){

      const sy = 40+i*34;

  function drawTableScene(showGlassGirl, showGlassBoy){

    px(tx-34, ty-6, 68, 8, PAL.tableTop);

  function wrapToLines(text, maxChars){
    const words = text.split(' ');
    let line = '', lines = [];
    for(const w of words){
      const test = line ? line+' '+w : w;
      if(test.length > maxChars){ lines.push(line); line = w; }
      else line = test;
    }
    if(line) lines.push(line);
    return lines;
  }

  function drawSpeechBubble(x, y, text){
    const maxChars = 15;
    const lines = wrapToLines(text, maxChars);
    const lineH = 10;
    const w = 108;
    const h = lines.length*lineH + 12;
    const top = y - h - 10;
    px(x-w/2, top, w, h, PAL.white);
    px(x-w/2, top, w, 3, PAL.dress);
    px(x-4, y-10, 8, 6, PAL.white);
    ctx.fillStyle = PAL.outline;
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    lines.forEach((l,i)=> ctx.fillText(l, x, top + 12 + i*lineH));
    ctx.textAlign = 'left';
  }

  // ============================================================
  // LIVELLO 2b — QUIZ
  // ============================================================
  let currentQuiz = 0;
  let glassGirlShown = false, glassBoyShown = false;
  const quizzes = [
    { q:'Francesca ordina:', options:['Mojito','Long Island','Spritz'], correct:1, onCorrect:()=>{ glassGirlShown=true; } },
    { q:'Gabriele ordina:', options:['Negroni','Gin Tonic','Caipiroska alla fragola'], correct:2, onCorrect:()=>{ glassBoyShown=true; } },
    { q:'Quanti drink ha bevuto Francesca in totale?', options:['2','3','4'], correct:1, onCorrect:()=>{} },
    { q:'Quanti drink ha bevuto Gabriele in totale?', options:['2','3','4'], correct:1, onCorrect:()=>{} }
  ];

  function showQuiz(quiz){
    quizQ.textContent = quiz.q;
    quizFb.textContent = '';
    quizOpts.innerHTML = '';
    quiz.options.forEach((opt, idx) => {
      const b = document.createElement('button');
      b.className = 'optBtn';
      b.textContent = opt;
      b.onclick = () => handleAnswer(quiz, idx, b);
      quizOpts.appendChild(b);
    });
    quizPanel.classList.add('show');
  }

  function handleAnswer(quiz, idx, btnEl){
    const buttons = Array.from(quizOpts.children);
    buttons.forEach(b => b.classList.add('disabled'));
    if(idx === quiz.correct){
      btnEl.classList.add('correct');
      quizFb.textContent = 'Esatto! ❤';
      quiz.onCorrect && quiz.onCorrect();
      setTimeout(()=>{
        quizPanel.classList.remove('show');
        if(currentQuiz < quizzes.length-1){
          currentQuiz++;
          setTimeout(()=> showQuiz(quizzes[currentQuiz]), 350);
        } else {
          goToOutro();
        }
      }, 850);
    } else {
      btnEl.classList.add('wrong');
      quizFb.textContent = 'Non proprio... riprova';
      setTimeout(()=>{
        buttons.forEach(b => { b.classList.remove('disabled'); b.classList.remove('wrong'); });
      }, 650);
    }
  }

  function drawQuizBackdrop(){
    drawBar();
    drawTableScene(glassGirlShown, glassBoyShown);
  }

  // ============================================================
  // LIVELLO 2c — OUTRO: verso l'auto + bacio
  // ============================================================
  let outroPhase = 'walkout', outroT = 0, coupleX = W/2;

  function goToOutro(){
    quizPanel.classList.remove('show');
    state = STATE.L2_OUTRO;
    outroPhase='walkout'; outroT=0; coupleX = W/2;
  }

  function updateOutro(dt){
    outroT += dt;
    if(outroPhase==='walkout'){
      coupleX += dt*50;
      if(coupleX > W+30){ outroPhase='street'; outroT=0; coupleX = -20; }
    } else if(outroPhase==='street'){
      coupleX += dt*40;
      if(coupleX >= W*0.42){ coupleX = W*0.42; outroPhase='kiss'; outroT=0; }
    } else if(outroPhase==='kiss'){

  // ============================================================
  // LIVELLO 3 — vista dall'alto, 14 bivi intorno al mondo
  // Percorso solo orizzontale/verticale, continuo (nessun reset tra un bivio e l'altro)
  // ============================================================
  const FIXED_Y3 = H*0.74;
  const STRAIGHT_LEN = 150;   // tratto dritto (verticale) prima di ogni bivio
  const BRANCH_LEN = 70;      // distanza dal bivio alla città (tratto orizzontale)
  const WRONG_LEN = 45;       // quanto puoi inoltrarti sulla strada sbagliata prima della barriera
  const SIGN_OFFSET = 22;     // il cartello è piazzato un po' prima della città
  const EXIT_LEN = 140;       // tratto dritto dopo la città giusta, prima del prossimo bivio
  const FINAL_EXTRA = 120;    // tratto extra dopo l'ultimo bivio, fino al cartello "NEXT STOP..."

  let playerWX = 0, playerWY = 0;   // posizione assoluta di Francesca nel mondo
  let forkAnchors = [ {x:0,y:0} ];   // punto di inizio (tratto dritto) di ciascun bivio, in ordine
  let phase3 = 'approach';           // approach -> junction -> exit
  let l3Keys = { up:false, down:false, left:false, right:false };
  let l3BumpT = 0;
  let currentForkIdx = 0;
  const L3_SPEED = 50;

  function resetL3(){
    playerWX = 0; playerWY = 0;
    forkAnchors = [ {x:0,y:0} ];
    phase3 = 'approach';
    l3BumpT = 0; currentForkIdx = 0;
    l3Keys = { up:false, down:false, left:false, right:false };
    setL3Hint('Usa le frecce per muoverti');
  }

  function goToL3Intro(){
    resetL3();
    state = STATE.L3_MAP;
    heartsEl.textContent = '';
    tapHint.style.display = 'none';
    skipBtn.style.display = 'none';
    quizPanel.classList.remove('show');
    dpad.style.display = 'flex';
    l3Hint.style.display = 'block';
  }

  function setL3Hint(text){ l3HintText.textContent = text; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function curFork(){ return FORKS[currentForkIdx]; }

  // punti chiave del bivio "idx", sempre derivati dal suo punto di partenza fisso
  function geometryForIdx(idx){
    const anchor = forkAnchors[idx];
    const fork = FORKS[idx];
    const dir = fork.correct==='left' ? -1 : 1;
    const fJ = { x: anchor.x, y: anchor.y - STRAIGHT_LEN };          // incrocio
    const fCorrectEnd = { x: fJ.x + dir*BRANCH_LEN, y: fJ.y };       // città giusta
    const fWrongEnd   = { x: fJ.x - dir*BRANCH_LEN, y: fJ.y };       // città sbagliata (visibile, irraggiungibile)
    const fBarrier    = { x: fJ.x - dir*WRONG_LEN, y: fJ.y };        // barriera sulla strada sbagliata
    const fSignCorrect= { x: fJ.x + dir*(BRANCH_LEN-SIGN_OFFSET), y: fJ.y };
    const fSignWrong  = { x: fJ.x - dir*Math.min(WRONG_LEN-14, BRANCH_LEN-SIGN_OFFSET), y: fJ.y };
    const fExitEnd    = { x: fCorrectEnd.x, y: fCorrectEnd.y - EXIT_LEN };
    const fExitEndDecoy = { x: fWrongEnd.x, y: fWrongEnd.y - EXIT_LEN };
    return { fork, dir, anchor, fJ, fCorrectEnd, fWrongEnd, fBarrier, fSignCorrect, fSignWrong, fExitEnd, fExitEndDecoy };
  }

  function updateL3(dt){
    if(l3BumpT>0) l3BumpT -= dt;

    let dx=0, dy=0;
    if(l3Keys.left)  dx -= L3_SPEED*dt;
    if(l3Keys.right) dx += L3_SPEED*dt;
    if(l3Keys.up)    dy -= L3_SPEED*dt;
    if(l3Keys.down)  dy += L3_SPEED*dt;

    const g = geometryForIdx(currentForkIdx);
    const anchor = g.anchor;

    if(phase3 === 'approach'){
      playerWX = clamp(playerWX+dx, anchor.x-16, anchor.x+16);
      playerWY = Math.min(playerWY+dy, anchor.y);
      if(anchor.y - playerWY >= STRAIGHT_LEN){
        playerWY = g.fJ.y;
        phase3 = 'junction';
      }
      setL3Hint(currentForkIdx===0 && anchor.y-playerWY < 10 ? 'Usa le frecce per muoverti' : 'Prosegui dritto...');

    } else if(phase3 === 'junction'){
      playerWY = g.fJ.y;
      playerWX = clamp(playerWX+dx, g.fJ.x-(BRANCH_LEN+15), g.fJ.x+(BRANCH_LEN+15));
      const rel = playerWX - g.fJ.x;
      const side = rel < 0 ? 'left' : 'right';
      const isCorrect = Math.abs(rel) > 2 && side === g.fork.correct;
      const isWrong = Math.abs(rel) > 2 && side !== g.fork.correct;

      if(isWrong && Math.abs(rel) > WRONG_LEN){
        playerWX = g.fJ.x + (rel<0?-1:1)*WRONG_LEN;
        if(dx!==0 && l3BumpT<=0){
          setL3Hint('Vicolo cieco! Torna indietro e vai verso ' + LOCATIONS[g.fork[g.fork.correct]].name);
          l3BumpT = 2.4;
        }
      }
      if(isCorrect && Math.abs(rel) >= BRANCH_LEN){
        playerWX = g.fJ.x + g.dir*BRANCH_LEN;
        if(l3Keys.up){
          phase3 = 'exit';
        }
      }

      if(l3BumpT<=0){
        if(Math.abs(rel) <= 2) setL3Hint('Bivio! Scegli una direzione');
        else if(isCorrect && Math.abs(rel)>=BRANCH_LEN) setL3Hint('Sei arrivata! Premi ▲ per continuare');
        else if(isCorrect) setL3Hint('Stai andando verso ' + LOCATIONS[g.fork[side]].name + '!');
        else setL3Hint('Sei sicura? Questa non sembra la strada giusta...');
      }

    } else if(phase3 === 'exit'){
      playerWX = clamp(playerWX+dx, g.fCorrectEnd.x-16, g.fCorrectEnd.x+16);
      playerWY += dy;
      if(playerWY >= g.fJ.y){
        playerWY = g.fJ.y;
        phase3 = 'junction';
      } else {
        const localExit = g.fJ.y - playerWY;
        if(currentForkIdx >= FORKS.length-1){
          setL3Hint(localExit >= EXIT_LEN ? 'Ultimo tratto...' : 'Prosegui dritto...');
          if(localExit >= EXIT_LEN + FINAL_EXTRA){
            goToFinaleAnim();
          }
        } else {
          setL3Hint('Prosegui dritto...');
          if(localExit >= EXIT_LEN){
            forkAnchors.push({ x: playerWX, y: playerWY });
            currentForkIdx++;
            phase3 = 'approach';
          }
        }
      }
    }
  }

  function screenPt3(wx, wy){
    return { x: W/2 + (wx-playerWX), y: FIXED_Y3 + (wy-playerWY) };
  }

  function drawQuad3(corners, color){
    ctx.fillStyle = color;
    ctx.beginPath();
    corners.forEach((c,i)=>{
      const p = screenPt3(c[0], c[1]);
      if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
    });
    ctx.closePath();
    ctx.fill();
  }

  function fillStar(cx, cy, outerR, innerR, points, color){
    ctx.fillStyle = color;
    ctx.beginPath();
    const rot = -Math.PI/2;
    for(let i=0;i<points*2;i++){
      const r = (i%2===0) ? outerR : innerR;
      const ang = rot + i*Math.PI/points;
      const x = cx + Math.cos(ang)*r;
      const y = cy + Math.sin(ang)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fill();
  }

  function triUp(cx, topY, baseW, h, color){
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, topY); ctx.lineTo(cx-baseW/2, topY+h); ctx.lineTo(cx+baseW/2, topY+h);
    ctx.closePath(); ctx.fill();
  }
  function domeTop(cx, cy, r, color){
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.closePath(); ctx.fill();
  }
  function circleShape(cx, cy, r, color){
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  }

  // ---------------- FLAGS (generico) ----------------
  function flagBase(wx,wy){
    const p = screenPt3(wx, wy);
    const poleH=24, fw=27, fh=17;
    px(p.x-1, p.y-poleH, 2, poleH, '#8a8a8a');
    return { fx:p.x, fy:p.y-poleH, fw, fh };
  }
  function flagVStripes(wx,wy,colors){
    const {fx,fy,fw,fh} = flagBase(wx,wy);
    const sw = fw/colors.length;
    colors.forEach((c,i)=> px(fx+i*sw, fy, Math.ceil(sw), fh, c));
  }
  function flagHStripes(wx,wy,colors){
    const {fx,fy,fw,fh} = flagBase(wx,wy);
    const sh = fh/colors.length;
    colors.forEach((c,i)=> px(fx, fy+i*sh, fw, Math.ceil(sh), c));
  }
  function flagStar(wx,wy,bg,star,corner){
    const {fx,fy,fw,fh} = flagBase(wx,wy);
    px(fx,fy,fw,fh,bg);

    fillStar(cx, fy+fh/2, 6.2, 2.6, 5, star);

  function drawForkScene(g){
    const ROAD_W = 18; // metà larghezza strada

    // tratto dritto (verticale) in ingresso al bivio
    drawQuad3([[g.anchor.x-ROAD_W,g.anchor.y+40],[g.anchor.x+ROAD_W,g.anchor.y+40],[g.anchor.x+ROAD_W,g.fJ.y],[g.anchor.x-ROAD_W,g.fJ.y]], '#8a7a86');
    // incrocio + tratto orizzontale verso entrambe le città (solo orizzontale, niente diagonali)
    drawQuad3([
      [Math.min(g.fWrongEnd.x,g.fCorrectEnd.x)-ROAD_W, g.fJ.y-ROAD_W],
      [Math.max(g.fWrongEnd.x,g.fCorrectEnd.x)+ROAD_W, g.fJ.y-ROAD_W],
      [Math.max(g.fWrongEnd.x,g.fCorrectEnd.x)+ROAD_W, g.fJ.y+ROAD_W],
      [Math.min(g.fWrongEnd.x,g.fCorrectEnd.x)-ROAD_W, g.fJ.y+ROAD_W]
    ], '#8a7a86');
    // tratto dritto dopo la città giusta, verso il prossimo bivio (percorribile)
    drawQuad3([[g.fCorrectEnd.x-ROAD_W,g.fJ.y],[g.fCorrectEnd.x+ROAD_W,g.fJ.y],[g.fCorrectEnd.x+ROAD_W,g.fExitEnd.y],[g.fCorrectEnd.x-ROAD_W,g.fExitEnd.y]], '#8a7a86');
    // stesso tratto anche sul lato sbagliato, solo scenografico: le due strade devono sembrare identiche
    drawQuad3([[g.fWrongEnd.x-ROAD_W,g.fJ.y],[g.fWrongEnd.x+ROAD_W,g.fJ.y],[g.fWrongEnd.x+ROAD_W,g.fExitEndDecoy.y],[g.fWrongEnd.x-ROAD_W,g.fExitEndDecoy.y]], '#8a7a86');

    drawLocationScene(g.fCorrectEnd, g.fork[g.fork.correct]);
    const wrongSide = g.fork.correct==='left' ? 'right' : 'left';
    drawLocationScene(g.fWrongEnd, g.fork[wrongSide]);
    drawRoadSign(g.fSignCorrect.x, g.fSignCorrect.y, LOCATIONS[g.fork[g.fork.correct]].name);
    drawRoadSign(g.fSignWrong.x, g.fSignWrong.y, LOCATIONS[g.fork[wrongSide]].name);
    drawBarrier3(g);
  }

  function resetFinaleAnim(){

  function goToFinaleAnim(){
    resetFinaleAnim();

    skipBtn.style.display = 'block';

  function easeInOutQuad(p){ return p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; }

  function updateFinaleAnim(dt){
    fAnim.t += dt;
    if(fAnim.phase==='walk'){
      const p = Math.min(1, fAnim.t/1.5);
      fAnim.gabX = GAB_START_X + (GAB_END_X-GAB_START_X)*easeInOutQuad(p);
      if(p>=1){ fAnim.phase='handoff'; fAnim.t=0; }
    } else if(fAnim.phase==='handoff'){
      if(fAnim.t>0.9){ fAnim.phase='zoom'; fAnim.t=0; }
    } else if(fAnim.phase==='zoom'){
      if(fAnim.t>1.1){ fAnim.phase='open'; fAnim.t=0; }
    } else if(fAnim.phase==='open'){
      if(fAnim.t>1.3){ goToFinale(); }
    }
  }

  function drawEnvelope(cx, cy, w, h, openT){
    px(cx-w/2, cy-h/2, w, h, '#fff5f9');
    ctx.strokeStyle = PAL.dress;
    ctx.lineWidth = Math.max(1, w*0.012);
    ctx.strokeRect(cx-w/2, cy-h/2, w, h);
    const apexY = cy - h/2 - openT*h*0.65;
    ctx.fillStyle = '#ffe1ee';
    ctx.beginPath();
    ctx.moveTo(cx-w/2, cy-h/2);
    ctx.lineTo(cx+w/2, cy-h/2);
    ctx.lineTo(cx, apexY);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    if(openT < 0.8){
      ctx.globalAlpha = 1-openT/0.8;
      drawHeart(cx, cy-h*0.1, Math.max(1,w*0.028), PAL.heart);
      ctx.globalAlpha = 1;
    }
    if(openT > 0.1){
      ctx.globalAlpha = Math.min(1,(openT-0.1)/0.5);
      px(cx-w*0.32, cy-h*0.12, w*0.64, h*0.4, '#fffaf3');
      ctx.globalAlpha = 1;
    }
  }

  function drawFinaleAnim(){
    const g2 = ctx.createLinearGradient(0,0,0,H);
    g2.addColorStop(0, PAL.skyTop); g2.addColorStop(1, PAL.skyBot);
    ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
    for(let i=0;i<10;i++){
      ctx.globalAlpha = 0.22;
      drawHeart((i*47+20)%W, 40+(i*37)%240, 2, PAL.white);
      ctx.globalAlpha = 1;
    }

    // data in alto
    ctx.textAlign = 'center';
    ctx.fillStyle = PAL.outline;
    ctx.font = 'bold 14px monospace';
    ctx.fillText(FINALE_DATE, W/2, 34);
    ctx.textAlign = 'left';

    const lf = Math.floor(clock*8)%2;

    if(fAnim.phase==='walk' || fAnim.phase==='handoff'){
      drawWalker(FRAN_X, CHAR_Y, 'girl', 0);
      drawWalker(fAnim.gabX, CHAR_Y, 'boy', fAnim.phase==='walk' ? lf : 0);

      let envX, envY, envScale;
      if(fAnim.phase==='walk'){
        envX = fAnim.gabX - 6; envY = CHAR_Y + 16; envScale = 1;
      } else {
        const p = easeInOutQuad(Math.min(1, fAnim.t/0.9));
        const startX = GAB_END_X-6, startY = CHAR_Y+16;
        const midX = (FRAN_X+GAB_END_X)/2 + 4, midY = CHAR_Y+14;
        envX = startX + (midX-startX)*p;
        envY = startY + (midY-startY)*p;
        envScale = 1 + 0.25*Math.sin(p*Math.PI);
      }
      drawEnvelope(envX, envY, 22*envScale, 15*envScale, 0);

    } else if(fAnim.phase==='zoom'){
      const p = easeInOutQuad(Math.min(1, fAnim.t/1.1));
      ctx.globalAlpha = Math.max(0, 1-p*1.4);
      drawWalker(FRAN_X, CHAR_Y, 'girl', 0);
      drawWalker(GAB_END_X, CHAR_Y, 'boy', 0);
      ctx.globalAlpha = 1;
      const startX = (FRAN_X+GAB_END_X)/2 + 4, startY = CHAR_Y+14;
      const envX = startX + (W/2-startX)*p;
      const envY = startY + (H/2-startY)*p;
      const w = 22 + (300-22)*p, h = 15 + (410-15)*p;
      drawEnvelope(envX, envY, w, h, 0);

    } else if(fAnim.phase==='open'){
      const p = Math.min(1, fAnim.t/1.0);
      drawEnvelope(W/2, H/2, 300, 410, p);
      if(fAnim.t > 1.0){
        ctx.globalAlpha = Math.min(1, (fAnim.t-1.0)/0.3);
        px(0,0,W,H,'#fffaf3');
        ctx.globalAlpha = 1;
      }
    }
  }

  function goToFinale(){
    state = STATE.FINALE;
    dpad.style.display = 'none';
    l3Hint.style.display = 'none';
    skipBtn.style.display = 'none';
    finaleTitleEl.textContent = FINALE_TITLE.replace(/<3/g, '❤');
    finaleBodyEl.textContent = FINALE_BODY.replace(/<3/g, '❤');
    finaleScreen.classList.add('show');
  }

  finaleReplayBtn.addEventListener('click', function(){
    finaleScreen.classList.remove('show');
    restartWholeGame();
  });

  // ============================================================
  // RESTART / BOOT
  // ============================================================
  function restartWholeGame(){
    resetIntro1();
    glassGirlShown=false; glassBoyShown=false; currentQuiz=0;
    resetL3();
    heartsEl.textContent = '';
    tapHint.style.display='none';
    skipBtn.style.display='none';
    quizPanel.classList.remove('show');
    dpad.style.display='none';
    l3Hint.style.display='none';
    finaleScreen.classList.remove('show');
    state = STATE.L1_INTRO;
    gameStarted = true;
    skipBtn.style.display='block';
  }

  function loop(t){
    if(!lastT) lastT = t;
    let dt = (t-lastT)/1000;
    if(dt>0.05) dt = 0.05;
    lastT = t;
    clock += dt;

    if(state===STATE.L1_INTRO && gameStarted) updateIntro1(dt);
    else if(state===STATE.L1_LEVEL) updateLevel(dt);
    else if(state===STATE.L1_PHARMACY) updatePharmacy(dt);
    else if(state===STATE.L1_TEST) updateTest(dt);
    else if(state===STATE.L2_INTRO && gameStarted) updateIntro2(dt);
    else if(state===STATE.L2_OUTRO) updateOutro(dt);
    else if(state===STATE.L3_MAP) updateL3(dt);
    else if(state===STATE.FINALE_ANIM) updateFinaleAnim(dt);

    ctx.clearRect(0,0,W,H);
    if(state===STATE.L1_INTRO) drawIntroTinder();
    else if(state===STATE.L1_MESSAGE) drawMessage();
    else if(state===STATE.L1_LEVEL) drawLevel();
    else if(state===STATE.L1_PHARMACY) drawPharmacy();
    else if(state===STATE.L1_TEST || state===STATE.L1_COMPLETE) drawTest();
    else if(state===STATE.L2_INTRO) drawIntroBar();
    else if(state===STATE.L2_QUIZ) drawQuizBackdrop();
    else if(state===STATE.L2_OUTRO || state===STATE.L2_COMPLETE) drawOutro();
    else if(state===STATE.L3_MAP || state===STATE.L3_COMPLETE) drawL3();
    else if(state===STATE.FINALE_ANIM) drawFinaleAnim();
    else if(state===STATE.L1_GAMEOVER) drawLevel();

    requestAnimationFrame(loop);
  }

  // ============================================================
  // INPUT
  // ============================================================
  function handleTap(e){
    if(e) e.preventDefault();
    if(state===STATE.L1_MESSAGE){ resetAndStartLevel(); return; }
    if(state===STATE.L1_LEVEL){ jump(); }
  }
  const stageEl = document.getElementById('stage');
  const excludedTarget = (t)=> t===skipBtn || t===ovBtn || t===ovBtn2 ||
    t.classList.contains('optBtn') || t.classList.contains('dpadBtn');

  function canvasPointFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? (e.touches[0]||e.changedTouches[0]) : e;
    return { x: (t.clientX-rect.left)*(W/rect.width), y: (t.clientY-rect.top)*(H/rect.height) };
  }

  function quickAdvanceFork(){
    const g = geometryForIdx(currentForkIdx);
    if(currentForkIdx >= FORKS.length-1){
      playerWX = g.fCorrectEnd.x; playerWY = g.fCorrectEnd.y;
      goToFinaleAnim();
    } else {
      playerWX = g.fExitEnd.x; playerWY = g.fExitEnd.y;
      forkAnchors.push({ x: g.fExitEnd.x, y: g.fExitEnd.y });
      currentForkIdx++;
      phase3 = 'approach';
      setL3Hint('Prosegui dritto...');
    }
  }

  function l3TapCheck(e){
    if(state !== STATE.L3_MAP) return false;
    const p = canvasPointFromEvent(e);
    const g = geometryForIdx(currentForkIdx);
    const sp = screenPt3(g.fCorrectEnd.x, g.fCorrectEnd.y);
    const dx = p.x-sp.x, dy = p.y-sp.y;
    if(Math.sqrt(dx*dx+dy*dy) < 42){
      quickAdvanceFork();
      return true;
    }
    return false;
  }

  stageEl.addEventListener('touchstart', function(e){
    if(excludedTarget(e.target)) return;
    if(l3TapCheck(e)){ e.preventDefault(); return; }
    if(introDragStart(e)){ e.preventDefault(); return; }
    handleTap(e);
  }, {passive:false});
  stageEl.addEventListener('touchmove', function(e){
    if(dragActive){ e.preventDefault(); introDragMove(e); }
  }, {passive:false});
  stageEl.addEventListener('touchend', function(e){
    if(dragActive){ e.preventDefault(); introDragEnd(); }
  }, {passive:false});
  stageEl.addEventListener('touchcancel', function(e){
    if(dragActive) introDragEnd();
  });

  stageEl.addEventListener('mousedown', function(e){
    if(excludedTarget(e.target)) return;
    if(l3TapCheck(e)){ e.preventDefault(); return; }
    if(introDragStart(e)){ e.preventDefault(); return; }
    handleTap(e);
  });
  stageEl.addEventListener('mousemove', function(e){
    if(dragActive) introDragMove(e);
  });
  stageEl.addEventListener('mouseup', function(e){
    if(dragActive) introDragEnd();
  });
  stageEl.addEventListener('mouseleave', function(e){
    if(dragActive) introDragEnd();
  });

  skipBtn.addEventListener('click', function(){
    if(state===STATE.L1_INTRO) goToMessage();
    else if(state===STATE.L2_INTRO) goToQuiz(0);
    else if(state===STATE.FINALE_ANIM) goToFinale();
  });

  function start(){
    heartsEl.textContent = '';
    tapHint.style.display='none';
    skipBtn.style.display='block';
    resetIntro1();
    state = STATE.L1_INTRO;
    showOverlay(
      'Prima di iniziare',
      'Scorri le card a sinistra o a destra: trova il match giusto su un\'app di incontri.',
      'Inizia ▸',
      ()=>{ gameStarted = true; }
    );
  }
  start();
  requestAnimationFrame(loop);

})();
</script>
